<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${event.id == null} ? 'Créer un Événement' : 'Éditer un Événement')}"></head>
<body>

    <!-- Header Navigation -->
    <header th:replace="~{fragments/layout :: navbar('admin-dashboard')}"></header>

    <!-- Main Content -->
    <main class="main-content">
        
        <!-- Back button removed to optimize space as per GYG guidelines -->

        <div class="admin-form-wrapper">
            <div class="admin-form-card">
                <h1 class="admin-form-title" th:text="${event.id == null} ? 'Créer un Événement / Activité' : 'Modifier l\'Événement'">Titre</h1>
                <form th:action="@{/admin/events/save}" th:object="${event}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="form-group">
                        <label for="siteId">Site Touristique d'accueil *</label>
                        <select id="siteId" name="siteId" class="select-control" required>
                            <option value="">Sélectionnez un site d'accueil...</option>
                            <option th:each="s : ${sites}" 
                                    th:value="${s.id}" 
                                    th:text="${s.nom}"
                                    th:selected="${event.site != null and event.site.id == s.id}"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="nom">Nom de l'Événement *</label>
                        <input type="text" id="nom" th:field="*{nom}" class="input-control" placeholder="Ex: Visite nocturne guidée, Grand concert symphonique..." required>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0.5rem;">
                        <div class="form-group">
                            <label for="date">Date &amp; Heure de l'événement *</label>
                            <input type="datetime-local" id="date" th:field="*{date}" class="input-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="prixTicket">Prix unitaire du ticket (FCFA) *</label>
                            <input type="number" id="prixTicket" th:field="*{prixTicket}" class="input-control" step="0.01" min="0" placeholder="0.00" required>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0.5rem;">
                        <div class="form-group">
                            <label for="placesMax">Nombre de places maximal (Capacité) *</label>
                            <input type="number" id="placesMax" th:field="*{placesMax}" class="input-control" min="1" placeholder="Ex: 50" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="duree">Durée de la visite (minutes)</label>
                            <input type="number" id="duree" th:field="*{duree}" class="input-control" min="1" placeholder="Ex: 120 (pour 2h)">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="guideId">Guide assigné</label>
                        <select id="guideId" name="guideId" class="select-control">
                            <option value="">Aucun guide assigné</option>
                            <option th:each="g : ${guides}" 
                                    th:value="${g.id}" 
                                    th:text="${g.user.username} + ' (Licence: ' + ${g.numeroLicence} + ')'"
                                    th:selected="${event.guide != null and event.guide.id == g.id}"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="description">Description de l'activité</label>
                        <textarea id="description" th:field="*{description}" class="input-control" rows="4" placeholder="Détaillez le programme de l'activité, le lieu de rendez-vous, le matériel recommandé..."></textarea>
                    </div>

                    <div class="d-flex gap-2" style="margin-top: 1.5rem;">
                        <button type="submit" class="btn btn-primary btn-sm">Enregistrer l'événement</button>
                        <a th:href="@{/admin/dashboard}" class="btn btn-secondary btn-sm">Annuler</a>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
