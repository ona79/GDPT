<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Accueil')}"></head>
<body>

    <!-- Navbar -->
    <header th:replace="~{fragments/layout :: navbar('home')}"></header>

    <!-- Contenu principal -->
    <main class="main-content">

        <!-- En-tête de section avec compteur + recherche inline -->
        <div class="section-title-container" style="margin-top: 0.5rem;">
            <h1 style="font-size: 1.5rem;">Patrimoine de la Casamance</h1>
            <span th:text="${sites.size()} + ' site(s)'"></span>
        </div>

        <!-- Barre de recherche compacte -->
        <div class="search-container" id="search-area">
            <form th:action="@{/}" method="get" class="search-form" id="main-search-form">
                <input type="hidden" id="userLat" name="userLat" th:value="${userLat}">
                <input type="hidden" id="userLng" name="userLng" th:value="${userLng}">

                <div class="search-segment" style="flex: 2;">
                    <label for="query">Rechercher</label>
                    <input type="text" id="query" name="query"
                           th:value="${selectedQuery}"
                           placeholder="Karabane, mangroves, cathédrale...">
                </div>
                <div class="search-segment">
                    <label for="categorie">Catégorie</label>
                    <select id="categorie" name="categorie">
                        <option value="">Toutes</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat}"
                                th:text="${cat}"
                                th:selected="${cat == selectedCategorie}"></option>
                    </select>
                </div>
                
                <button type="button" id="btn-gps" class="search-gps-btn" style="background: none; border: none; border-right: 1px solid var(--clr-border); padding: 0 1rem; color: var(--clr-accent); cursor: pointer;" title="Trier par proximité GPS">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="3"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                    </svg>
                </button>

                <button type="submit" class="search-submit-btn" aria-label="Lancer la recherche">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </form>
        </div>

        <!-- Chips filtres catégorie -->
        <div class="chips-container">
            <div class="chips-scroll-wrapper">
                <a th:href="@{/(query=${selectedQuery})}"
                   class="chip-filter"
                   th:classappend="${selectedCategorie == null} ? ' active'">Tous</a>

                <a th:each="cat : ${categories}"
                   th:href="@{/(query=${selectedQuery}, categorie=${cat == selectedCategorie ? null : cat})}"
                   class="chip-filter"
                   th:classappend="${cat == selectedCategorie} ? ' active'">
                    <span th:text="${cat}">Catégorie</span>
                    <span th:if="${cat == selectedCategorie}" class="chip-close">&times;</span>
                </a>
            </div>
        </div>

        <!-- Alertes (SVG monochromes) -->
        <div th:if="${param.success}" class="alert-banner alert-banner-success">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span th:text="${param.success}">Opération réussie.</span>
        </div>
        <div th:if="${param.error}" class="alert-banner alert-banner-danger">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span th:text="${param.error}">Une erreur est survenue.</span>
        </div>

        <!-- Grille de vignettes -->
        <div class="grid-sites" id="results-section">

            <!-- Aucun résultat -->
            <div th:if="${sites.isEmpty()}"
                 style="grid-column: 1 / -1; text-align: center; padding: 3rem 0; color: var(--clr-text-secondary);">
                <h3>Aucun site ne correspond à vos critères.</h3>
                <p style="margin-top: 0.4rem; font-size: 0.875rem;">Modifiez vos mots-clés ou essayez une autre catégorie.</p>
                <a th:href="@{/}" class="btn btn-secondary btn-sm mt-4" style="margin-top: 1rem; display: inline-flex;">Réinitialiser</a>
            </div>

            <!-- Boucle sur les sites — la carte entière est un lien -->
            <a th:each="site : ${sites}"
               th:href="@{/sites/details/{id}(id=${site.id})}"
               class="card-site">

                <div class="card-image-wrapper">
                    <img th:if="${site.imageUri != null and !site.imageUri.isEmpty()}"
                         th:src="${site.imageUri}"
                         th:alt="${site.nom}"
                         class="card-image"
                         loading="lazy"
                         onerror="this.style.display='none'; this.parentNode.querySelector('.image-placeholder').style.display='flex';">

                    <div class="image-placeholder"
                         th:style="${site.imageUri != null and !site.imageUri.isEmpty()} ? 'display:none;' : 'display:flex;'">
                        <span>Photo indisponible</span>
                    </div>

                    <!-- Overlay description (hover desktop uniquement via CSS) -->
                    <div class="card-overlay-desc">
                        <p th:text="${#strings.abbreviate(site.description, 140)}">Description...</p>
                    </div>

                    <!-- Badge catégorie -->
                    <div class="card-category-overlay">
                        <span class="badge"
                              th:classappend="'badge-' + ${site.categorie.name().toLowerCase()}"
                              th:text="${site.categorie}"></span>
                    </div>

                    <!-- Prix -->
                    <div class="card-price-overlay">
                        <span th:text="${site.tarifEntree == 0.0} ? 'Gratuit' : ${#numbers.formatDecimal(site.tarifEntree, 1, 0) + ' FCFA'}"></span>
                    </div>
                </div>

                <div class="card-body">
                    <h3 class="card-title" th:text="${site.nom}">Nom du site</h3>
                    <div class="card-location">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        <span th:text="${site.localisation}">Localisation</span>
                        <span th:if="${distances.containsKey(site.id)}" th:text="' (à ' + ${distances.get(site.id)} + ' km)'" style="color: var(--clr-accent); font-weight: bold; font-size: 0.75rem;"></span>
                    </div>
                    <div class="card-footer">
                        <div class="rating-stars">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="color:var(--clr-kapok);"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                            <span th:text="${ratings.get(site.id) > 0.0} ? ${#numbers.formatDecimal(ratings.get(site.id), 1, 1)} : 'Aucun avis'"></span>
                        </div>
                        <span style="font-size: 0.72rem; color: var(--clr-accent); font-weight: 600;">Voir &rarr;</span>
                    </div>
                </div>
            </a>
        </div>

    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script>
        // Auto-scroll vers les résultats si filtre actif ou GPS actif
        (function() {
            const params = new URLSearchParams(window.location.search);
            const hasFilter = (params.get('categorie') || '').trim() !== '' ||
                              (params.get('query') || '').trim() !== '' ||
                              (params.get('userLat') || '').trim() !== '';
            if (hasFilter) {
                const target = document.getElementById('search-area');
                if (target) target.scrollIntoView({ behavior: 'instant', block: 'start' });
            }
        })();

        // GPS Proximity Search Handler
        document.addEventListener('DOMContentLoaded', () => {
            const gpsBtn = document.getElementById('btn-gps');
            if (gpsBtn) {
                gpsBtn.addEventListener('click', () => {
                    if (navigator.geolocation) {
                        gpsBtn.style.opacity = '0.5';
                        navigator.geolocation.getCurrentPosition(
                            (position) => {
                                document.getElementById('userLat').value = position.coords.latitude;
                                document.getElementById('userLng').value = position.coords.longitude;
                                document.getElementById('main-search-form').submit();
                            },
                            (error) => {
                                alert("Erreur de géolocalisation : " + error.message);
                                gpsBtn.style.opacity = '1';
                            }
                        );
                    } else {
                        alert("Votre navigateur ne supporte pas la géolocalisation.");
                    }
                });
            }
        });
    </script>

</body>
</html>
